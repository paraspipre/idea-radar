# Idea Radar default configuration.
#
# Override order (later wins):
#   1. this file
#   2. config/local.yaml          (gitignored, same shape, partial is fine)
#   3. env vars RADAR__SECTION__KEY, e.g. RADAR__BUDGET__MAX_LLM_CALLS_PER_RUN=10
#      (values are parsed as YAML scalars; .env is loaded first)
#
# Unknown keys are errors. Secrets never go here: put source tokens in .env.
# Run `uv run radar config` to see the effective result.

app:
  data_dir: data            # relative to the project root, or absolute
  log_level: INFO           # DEBUG | INFO | WARNING | ERROR
  log_format: console       # console | json

db:
  url: null                 # null -> sqlite:///<data_dir>/radar.db; any SQLAlchemy URL works

llm:
  backend: agent_sdk        # agent_sdk (Claude subscription login) | anthropic_api (stub)
  models:                   # aliases passed to the Agent SDK `model` option
    small: haiku            # extraction, cluster naming
    strong: sonnet          # competition, sizing, skeptic
  effort:                   # Agent SDK `effort`: low | medium | high | xhigh | max
    small: low
    strong: medium
  allow_api_key_env: false  # keep false: refuse to run if ANTHROPIC_API_KEY is set
  timeout_s: 300            # per call
  max_attempts: 3           # retries only for transient errors (5xx, overloaded, timeouts)
  backoff_base_s: 2.0
  max_budget_usd_per_call: 0.5   # runaway guard on the SDK's API-equivalent cost estimate

budget:
  max_llm_calls_per_run: 21
  per_stage:                # each must be <= max_llm_calls_per_run
    extract: 10
    name_clusters: 2
    competition: 3
    sizing: 3
    skeptic: 3
  # Stop after the current call when the SDK reports a rate-limit warning,
  # leaving headroom for your own Claude use.
  stop_on_rate_limit_warning: true

focus:
  name: Developer tools and B2B SaaS for small teams
  description: >-
    Problems that developers, technical founders, and small teams (2-50 people)
    hit in their daily work, where a software product could plausibly be sold.
  keywords:
    - developer tool
    - workflow
    - automation
    - small team
    - saas
    - integration
    - devops
    - api

ingest:
  lookback_days: 30         # first run only; later runs continue from saved cursors
  max_items_per_query: 200
  request_timeout_s: 30
  user_agent: idea-radar/0.1 (personal research tool)
  retention_days: 90        # rejected/duplicate raw items older than this are purged

sources:
  hackernews:               # Algolia HN Search API, no auth
    enabled: true
    min_interval_s: 1.0
    queries:
      - {query: "is there a tool", tags: comment}
      - {query: "I wish there was", tags: comment}
      - {query: "I would pay for", tags: comment}
      - {query: "looking for a tool", tags: comment}
      - {query: "alternative to", tags: ask_hn}
      - {query: "how do you manage", tags: ask_hn}
      - {query: "does anyone know a tool", tags: comment}
      - {query: "so frustrating", tags: comment}
      - {query: "we ended up building", tags: comment}
      - {query: "too expensive for", tags: comment}
  stackexchange:            # Stack Exchange API 2.3; 300 req/day without STACKEXCHANGE_KEY
    enabled: true
    min_interval_s: 1.0
    sites: [softwarerecs, webapps]
    queries: [""]           # "" = every new question (these sites are request-shaped)
  github:                   # GitHub search API; GITHUB_TOKEN optional
    enabled: true
    min_interval_s: 7.0
    queries:
      - is:issue label:"feature request" reactions:>=10
      - is:issue label:enhancement reactions:>=20
      - is:issue label:feature-request reactions:>=10
  appstore:                 # Apple customer-reviews RSS feed; only low ratings are kept
    enabled: true
    min_interval_s: 2.0
    country: us
    max_rating: 2
    max_pages: 3
    apps:
      Slack: 618783545
      Notion: 1232780281
      Trello: 461504587
      Asana: 489969512
      GitHub: 1477376905
  producthunt:              # needs PRODUCTHUNT_TOKEN; adapter lands when a token exists
    enabled: false
  reddit:                   # needs approved API access; adapter lands when credentials exist
    enabled: false

prefilter:
  threshold: 1.5            # items scoring below this never reach an LLM
  min_chars: 40
  snippet_chars: 500        # what the LLM will see per item (token budget!)
  source_prior:             # some sources are problem-shaped by construction
    appstore: 1.0           # a 1-2 star review is a complaint
    stackexchange: 1.5      # softwarerecs/webapps questions are requests (first live run:
                            # nearly every SE near-miss at 1.0 was a genuine request)
    github: 1.0             # upvoted feature requests are explicit demand
    hackernews: 0.0

extraction:                 # stage 2 (LLM, small tier)
  batch_size: 25            # items per call; with budget.per_stage.extract=10 -> 250 items/run
  prompt_version: 1         # llm/prompts/extract.v1.md; bump to re-extract everything
  max_turns: 3

clustering:                 # stage 3 (local embeddings + HDBSCAN; naming is the only LLM part)
  embedding_model: BAAI/bge-small-en-v1.5
  assign_threshold: 0.90    # cosine to an existing centroid to join it (bge-small sims run high:
                            # unrelated problems score 0.83-0.90, related ones 0.92+)
  merge_threshold: 0.94     # cosine between centroids to merge clusters
  min_cluster_size: 2
  min_member_similarity: 0.90  # purity guard: weaker HDBSCAN members return to the pool
  min_pool: 6               # unassigned problems needed before HDBSCAN runs
  rename_growth: 0.25       # re-name a cluster only after it grows 25%
  naming_batch: 8           # clusters named per LLM call
  examples_per_cluster: 5

demand:                     # stage 4 (pure Python, no LLM)
  weights: {volume: 0.25, trend: 0.10, recency: 0.10, engagement: 0.15, wtp: 0.20, corroboration: 0.20}
  half_life_days: 30
  trend_window_days: 28
  top_n: 3                  # only these clusters get competition/sizing/skeptic (stages 5-7)
