# For developers using the plain `alembic` CLI, e.g.
#   uv run alembic revision --autogenerate -m "add raw_items"
# The database URL comes from Idea Radar's config (config/default.yaml + overrides).
# Day-to-day, use `uv run radar db init` instead.

[alembic]
script_location = src/idea_radar/db/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
