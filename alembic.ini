# Only used by the plain Alembic CLI, e.g. to draft a migration:
#   uv run alembic revision --autogenerate -m "add raw_items"
# The database URL comes from Idea Radar's config (config/default.yaml + overrides).
# `radar db init` configures Alembic in code and does not read this file.

[alembic]
script_location = %(here)s/src/idea_radar/db/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
