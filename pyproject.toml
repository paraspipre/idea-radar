[project]
name = "idea-radar"
version = "0.1.0"
description = "Finds unmet problems in public discussions and ranks them as evidence-backed business opportunities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
radar = "idea_radar.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idea_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/idea_radar"]
mypy_path = "src"
exclude = ["src/idea_radar/db/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
