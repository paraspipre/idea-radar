[project]
name = "idea-radar"
version = "0.1.0"
description = "Finds unmet problems in public discussions and ranks them as evidence-backed opportunities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    # Pinned: all SDK usage lives in llm/agent_sdk.py; re-verify the docs before bumping.
    "claude-agent-sdk==0.2.182",
    "fastembed>=0.9.1",
    "httpx>=0.27",
    "langgraph>=1.2.22",
    "numpy>=2.5.4",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.scripts]
radar = "idea_radar.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idea_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# T20: no print() -- use the CLI's typer.echo or structured logging.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["idea_radar"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/idea_radar", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["src/idea_radar/db/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[[tool.mypy.overrides]]
module = ["sklearn.*", "fastembed.*"]
ignore_missing_imports = true
